[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "redcheck"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27.0",
    "pytest>=8.2.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["redcheck*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
